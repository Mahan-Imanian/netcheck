name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p netcheck-core
      - run: git diff --exit-code src/bindings
      - run: cargo clippy -p netcheck-core --all-targets -- -D warnings -W clippy::unwrap_used
      - run: pnpm typecheck && pnpm test && pnpm build
      - name: No demo code in the shipped bundle
        run: "! grep -l 'createDemoBackend\\|DEV-ONLY' dist/assets/*.js"

  windows:
    runs-on: windows-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Unit + loopback ICMP integration tests (real IcmpSendEcho2)
        run: cargo test -p netcheck-core
      - run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::unwrap_used
      - name: Import signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("cert.pfx", $bytes)
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item cert.pfx
          "SIGN_CONFIG={`"bundle`":{`"windows`":{`"certificateThumbprint`":`"$($cert.Thumbprint)`",`"digestAlgorithm`":`"sha256`",`"timestampUrl`":`"http://timestamp.digicert.com`"}}}" >> $env:GITHUB_ENV
      - name: Build signed MSI + NSIS
        shell: pwsh
        run: |
          if ($env:SIGN_CONFIG) { pnpm tauri build --config $env:SIGN_CONFIG } else { pnpm tauri build }
      - uses: actions/upload-artifact@v4
        with:
          name: netcheck-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
