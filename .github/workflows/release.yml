name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.0
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Build installers and draft the release
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p netcheck-core

      - name: Import signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("cert.pfx", $bytes)
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item cert.pfx
          "SIGN_CONFIG={`"bundle`":{`"windows`":{`"certificateThumbprint`":`"$($cert.Thumbprint)`",`"digestAlgorithm`":`"sha256`",`"timestampUrl`":`"http://timestamp.digicert.com`"}}}" >> $env:GITHUB_ENV

      - name: Build MSI and NSIS installers
        shell: pwsh
        run: |
          if ($env:SIGN_CONFIG) { pnpm tauri build --config $env:SIGN_CONFIG } else { pnpm tauri build }

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi out/
          Copy-Item target/release/netcheck.exe "out/Netcheck_$($env:TAG.TrimStart('v'))_x64-portable.exe"
          Get-ChildItem out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out/SHA256SUMS.txt -Encoding ascii

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[').LineNumber | Select-Object -First 1
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $sums = Get-Content out/SHA256SUMS.txt
          $body += @(
            "",
            "## Install",
            "",
            "- ``Netcheck_${version}_x64-setup.exe`` installs for your user, with no admin rights needed.",
            "- ``Netcheck_${version}_x64_en-US.msi`` installs for all users.",
            "- ``Netcheck_${version}_x64-portable.exe`` runs without installing. It needs WebView2, which Windows 11 includes.",
            "",
            "Check a download with ``Get-FileHash .\<file> -Algorithm SHA256`` against:",
            "",
            '```'
          ) + $sums + @(
            '```',
            "",
            "The files are not code-signed, so SmartScreen will probably warn (More info, then Run anyway), and Smart App Control may block them. Built by the release workflow from the ``$env:TAG`` tag. Tested on Windows 11 only."
          )
          $body | Set-Content notes.md -Encoding utf8

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:TAG out/* --draft --verify-tag --title "Netcheck $env:TAG" --notes-file notes.md
