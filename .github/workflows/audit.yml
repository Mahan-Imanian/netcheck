name: Security audit

on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths: ["Cargo.lock", "pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - run: cargo audit

  npm:
    name: npm advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: pnpm audit --prod
