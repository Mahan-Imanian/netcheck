name: Feature request
description: Suggest something Netcheck should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Netcheck to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
