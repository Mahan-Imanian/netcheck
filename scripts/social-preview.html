<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url("../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 100 900; src: url("../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2"); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: #0b0d10; }
  body {
    position: relative; color: #ece8e1; font-family: "Geist", sans-serif;
    background:
      linear-gradient(rgb(236 232 225 / 0.03) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgb(236 232 225 / 0.03) 1px, transparent 1px) 0 0 / 32px 32px,
      radial-gradient(90% 120% at 100% 50%, #14181d, #0b0d10 70%);
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 64px; height: 64px; }
  .word { font-family: "Barlow Condensed"; font-weight: 700; font-size: 64px; letter-spacing: 0.14em; line-height: 1; }
  h1 { margin-top: 40px; font-family: "Barlow Condensed"; font-weight: 700; font-size: 56px; line-height: 1.02; letter-spacing: 0.02em; text-transform: uppercase; }
  p { margin-top: 22px; font-size: 21px; line-height: 1.45; color: #a2a5a9; max-width: 430px; }
  .tags { margin-top: 34px; display: flex; gap: 10px; }
  .tag { font-family: "Barlow Condensed"; font-weight: 600; font-size: 19px; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 12px; background: #1a1f25; box-shadow: inset 0 0 0 1px rgb(236 232 225 / 0.14);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
  .shot { position: absolute; right: -150px; top: 70px; width: 820px;
    clip-path: polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px);
    box-shadow: 0 30px 80px rgb(0 0 0 / 0.6); outline: 1px solid rgb(236 232 225 / 0.18); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 32 32"><path d="M7 0H32V25L25 32H0V7Z" fill="#ece8e1"/><rect x="6.5" y="19.5" width="3.6" height="6" fill="#0b0d10"/><rect x="11.75" y="15.5" width="3.6" height="10" fill="#0b0d10"/><rect x="17" y="11.5" width="3.6" height="14" fill="#0b0d10"/><rect x="22.25" y="7.5" width="3.6" height="18" fill="#33d6a3"/></svg>
      <div class="word">NETCHECK</div>
    </div>
    <h1>Connection check<br>for Counter&#8209;Strike&nbsp;2</h1>
    <p>Pings every Valve server region, measures jitter and packet loss, and traces the route to the fastest one.</p>
    <div class="tags"><div class="tag">Windows</div><div class="tag">Open source</div><div class="tag">Rust + Tauri</div></div>
  </div>
  <div class="shot"><img src="../docs/screenshots/real-windows.png"></div>

</html>
